# SonarCloud automatic analysis configuration.
#
# `archive/` and `reference/` are not part of the product. Nothing in them is
# imported, built, deployed, or maintained: `archive/` is finished history and
# `reference/` holds source material kept for reading, including the original
# React prototype this app was grown from.
#
# Analysing them reports findings against code nobody can act on. The prototype
# in particular uses `Math.random()` for character selection throughout, which
# is correct for a throwaway artifact and meaningless as a security finding
# against a repository that does not run it.
#
# Application code under `app/` is analysed as normal.
sonar.exclusions=archive/**,reference/**
